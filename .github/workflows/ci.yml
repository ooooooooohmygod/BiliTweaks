name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: 补丁链路自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 smali / baksmali（Ubuntu 官方源）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsmali-java
          command -v smali baksmali
          baksmali --version

      - name: Python 语法检查
        run: python3 -m py_compile src/patcher.py src/build.py test/selftest.py test/check_rules.py

      - name: 补丁规则校验
        run: python3 test/check_rules.py

      - name: 全链路自测（smali -> baksmali -> 补丁 -> 回编 -> 回读）
        run: python3 test/selftest.py

      - name: Shell 语法检查
        run: bash -n scripts/build.sh

      - name: 构建脚本可用性
        run: python3 src/build.py --help > /dev/null
