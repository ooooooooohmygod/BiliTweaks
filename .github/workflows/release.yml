name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  toolkit:
    name: 打包工具包并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 smali / baksmali（Ubuntu 官方源）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsmali-java
          command -v smali baksmali
          baksmali --version

      - name: 发布前校验与自测
        run: |
          python3 test/check_rules.py
          python3 test/selftest.py

      - name: 打包工具包
        run: |
          zip -r "bili-noads-toolkit-${GITHUB_REF_NAME}.zip" \
            README.md LICENSE patches src scripts test docs tools

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            bili-noads-toolkit-*.zip \
            --title "bili-noads ${GITHUB_REF_NAME}" \
            --notes "自备官方 APK，用工具包自行构建；本 Release 不包含任何成品 APK。用法见 README。" \
            --generate-notes
