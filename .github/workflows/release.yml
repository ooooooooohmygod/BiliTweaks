name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  toolkit:
    name: 打包工具包并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 下载 smali / baksmali 2.5.2
        run: |
          mkdir -p tools
          curl -fsSL -o tools/smali.jar https://repo1.maven.org/maven2/com/android/tools/smali/smali/2.5.2/smali-2.5.2.jar
          curl -fsSL -o tools/baksmali.jar https://repo1.maven.org/maven2/com/android/tools/smali/baksmali/2.5.2/baksmali-2.5.2.jar

      - name: 发布前校验与自测
        env:
          SMALI: java -jar tools/smali.jar
          BAKSMALI: java -jar tools/baksmali.jar
        run: |
          python3 test/check_rules.py
          python3 test/selftest.py

      - name: 打包工具包
        run: |
          zip -r "bili-noads-toolkit-${GITHUB_REF_NAME}.zip" \
            README.md LICENSE patches src scripts test docs tools

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            bili-noads-toolkit-*.zip \
            --title "bili-noads ${GITHUB_REF_NAME}" \
            --notes "自备官方 APK，用工具包自行构建；本 Release 不包含任何成品 APK。用法见 README。" \
            --generate-notes
