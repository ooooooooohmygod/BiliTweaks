import java.util.Properties

plugins { id "com.android.application" }

def signingPropertiesFile = rootProject.file("signing-private/signing.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace "io.github.ooooooooohmygod.bilitweaks"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.ooooooooohmygod.bilitweaks"
        minSdk 26
        targetSdk 36
        versionCode 30
        versionName "2.4.8"
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.isFile()) {
                storeFile rootProject.file(signingProperties.getProperty("storeFile"))
                storePassword signingProperties.getProperty("storePassword")
                keyAlias signingProperties.getProperty("keyAlias")
                keyPassword signingProperties.getProperty("keyPassword")
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingPropertiesFile.isFile() ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            outputFileName = "BiliTweaks_${android.defaultConfig.versionName}.apk"
        }
    }

    packaging {
        resources {
            merges += "META-INF/xposed/*"
        }
    }
}

dependencies {
    compileOnly "io.github.libxposed:api:102.0.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "com.google.android.material:material:1.12.0"
}
